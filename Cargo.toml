[package]
name = "ragrig-egui"
version = "0.4.0"
edition = "2024"
rust-version = "1.92"
description = "The egui agent interface for the ragrig RAG framework — transcript, composer, component bar and dockable panes"
license = "MIT"
repository = "https://github.com/schmettow/ragrig-egui"
readme = "README.md"
keywords = ["ragrig", "egui", "agent", "rag", "gui"]
categories = ["gui"]

[features]
default = ["markdown"]
# Light Markdown rendering for assistant messages (pulldown-cmark).
markdown = ["dep:pulldown-cmark"]

[dependencies]
egui = "0.34"
pulldown-cmark = { version = "0.13", default-features = false, optional = true }
